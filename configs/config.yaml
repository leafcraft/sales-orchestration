# sales-orchestration — Sales-Orchestration Pod (lead → qualified → committed)
#
# A pod of digital employees + a human sales roster that runs an inbound lead
# end to end: any-source lead -> Sol opens the case -> intake normalises &
# enriches -> qualification scores + personalises + routes on its tier × intent
# matrix -> AE/SDR handoff (human gate) -> Deal Desk (the FINISHER) re-checks the
# human approval, renders the opportunity pack, and commits it -> WORM audit.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every hand-off is
# a finished contract; nothing advances on silence (an unanswered gate closes its
# Inbox card and the ticket records that no reply came); the finisher produces
# the real artifact and FAILS CLOSED; the WORM sink is the terminus. Systems (Salesforce / HubSpot / Outreach) are TOOLS behind n8n
# connectors, never members — their state genuinely lives in your CRM/MAP.
#
# A CRO reading this file sees their sales department.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "sales-orchestration"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# The Manager is the SUPERVISOR — it watches every hand-off and escalates to the
# Sales Manager when an agent hits an error that a retry cannot fix (auth, bad
# request, credit, bad config), when 3 different agents fail in one session, or
# when restarts run out. A contract violation (a hand-off missing its yields)
# raises an alert, not an escalation. It does NOT chase an unanswered approval
# and it does NOT watch SLAs — the pipeline sweep (pipeline_health_agent, once
# its CRM connector is wired) does that. It is not a router in the middle.
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true
  prompt: |
    Inbound-sales orchestration pod. A successful lead flows: Sol (coordinator)
    opens the case -> lead_intake normalises + enriches -> lead_qualification
    scores fit to ICP + intent AND crafts the personalised opener in one pass,
    then routes on its tier × intent matrix (hot -> AE; warm high-intent or
    low-hook -> SDR; warm/cold with a usable hook -> nurture; competitor ->
    research; spam -> audit). After the human AE approves, the Deal Desk finisher
    re-checks the approval and commits the opportunity pack.

    Escalate to the Sales Manager when an agent fails in a way a retry will not
    fix, or keeps failing. An approval nobody answers is not escalated: the
    request waits its time and stops, and nothing is sent or committed on
    silence. SLA and queue-size checks belong to the pipeline sweep
    (pipeline_health_agent), not to you.
  routing:
    mode: "static"
  escalation:
    targets:
      - type: "human_agent"
        agent: "sales_manager_human"
      # Webhook escalation (e.g. PagerDuty): create the vault connection
      # 'escalation_webhook' (an "Add custom" record on the Infrastructure
      # page, service type 'Outbound webhook'), then uncomment — here before the
      # first start, in Studio's YAML editor after it (applies live, no restart).
      # - type: "webhook"
        # connection: escalation_webhook   # vault connection holds the URL + headers
        # method: "POST"
        # payload_template:
          # incident_id: "{{lead_id}}"
          # severity: "{{severity}}"
          # message: "{{message}}"
          # session_id: "{{session_id}}"
      # Slack escalation: posting needs a Slack adapter, which comes from a
      # human seat's channels block. Connect Slack on Infrastructure →
      # Messaging → Slack (vault record, e.g. 'slack_sales'), give
      # sales_manager_human `channels: {slack: {connection: slack_sales}}`, set
      # SLACK_SALES_CHANNEL in .env, then uncomment — here before the first
      # start, in Studio's YAML editor after it. Shipped commented because with
      # no adapter the target cannot deliver anything.
      # - type: "channel"
        # provider: "slack"
        # channel_id: "${SLACK_SALES_CHANNEL:}"
        # message_template: "[sales] {{message}} — lead {{lead_id}}"
    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3

# 2.4.131 runtime block — the ONE non-default this pod genuinely needs: a
# super-agent research pass over many sources can run long. Everything else
# stays default (omission is meaningful; we do not pre-fill defaults). The
# `timeouts` block is REJECTED by <=2.4.130 — it lands with the 2.4.131 floor.
timeouts:
  mesh_call_default_timeout_s: 150
  llm_hard_timeout_s: 300

data_structures:
  Lead:
    type: "object"
    properties:
      lead_id: { type: "string" }
      source: { type: "string" }        # webform | demo | event | partner | manual
      company_domain: { type: "string" }
      email: { type: "string" }
      job_title: { type: "string" }
      intent_signal: { type: "string" }
      received_at_utc: { type: "string" }
      raw_payload: { type: "object" }
    required: ["source"]

# ── Entry points — one per real-world trigger. Inbound leads open a case with
#    Sol (the coordinator); direct-call entries hit a specialist for ad-hoc /
#    debug / programmatic use. Multiple entry points, one owner per stage. ──
entry_points:
  - name: "webform_lead"
    target: "sales_coordinator_agent"
    description: "Marketing website form submit — Sol opens the lead case."
    condition: always
  - name: "demo_request"
    target: "sales_coordinator_agent"
    description: "Demo / trial request — Sol opens the lead case."
    condition: always
  - name: "event_list"
    target: "sales_coordinator_agent"
    description: "Trade show / webinar / event-list batch ingest."
    condition: always
  - name: "partner_referral"
    target: "sales_coordinator_agent"
    description: "Partner-sourced lead."
    condition: always
  - name: "manual_action"
    target: "sales_coordinator_agent"
    description: "RevOps / SDR-initiated lead."
    condition: always
  - name: "lead_status"
    target: "sales_coordinator_agent"
    description: "Anyone asks 'where is this lead?' — Sol answers from the case record."
    condition: always

  # ── HITL resume + finisher entry ──
  - name: "sales_reply"
    target: "ae_human"
    description: "HITL resume — an AE approves / rejects a routed lead."
    condition: always
  - name: "commit_opportunity"
    target: "deal_desk_agent"
    description: "Programmatic commit of an already-approved opportunity (replay / debug)."
    condition: always

  # ── Connector / scheduled entries (state lives in your CRM/MAP) ──
  - name: "scheduled_pipeline_health"
    target: "pipeline_health_agent"
    description: "Pipeline sweep — flag stalled / SLA-breached leads (cron off until CRM connector wired)."
    condition: always
  - name: "opp_stage_update"
    target: "pipeline_health_agent"
    description: "Record one opportunity stage update (mode=ingest)."
    condition: always
  - name: "pipeline_health_sweep"
    target: "pipeline_health_agent"
    description: "Sweep current pipeline for stalled opps + coverage gaps (mode=report)."
    condition: always
  - name: "pre_meeting_dossier"
    target: "sales_research_agent"
    description: "Build a pre-meeting dossier for an account (AE-initiated, mode=dossier)."
    condition: always
  - name: "competitive_intel_pull"
    target: "sales_research_agent"
    description: "AE-initiated competitive intel pack for a deal in flight (mode=intel)."
    condition: always
  - name: "weekly_lead_revival"
    target: "lead_revival_agent"
    description: "Tue 10:00 cron — sweep 90d+ cold leads for new intent signals."
    condition: always
  - name: "lost_deal_revival"
    target: "lead_revival_agent"
    description: "Closed-lost deal anniversary — recheck for re-engagement signals."
    condition: always
  - name: "ghosted_lead_recovery"
    target: "lead_revival_agent"
    description: "Prospect went dark mid-cycle — design a polite re-engagement play."
    condition: always
  - name: "enrol_in_nurture"
    target: "deal_nurturer_agent"
    description: "Drop a specific lead into the nurture queue (mode=enrol)."
    condition: always
  - name: "nurture_daily_sweep"
    target: "deal_nurturer_agent"
    description: "Daily sweep — advance due touches + check graduations (cron off until MAP connector wired)."
    condition: always
  - name: "register_abm_contact"
    target: "abm_orchestrator_agent"
    description: "Register a contact against the account ledger (mode=register)."
    condition: always
  - name: "coordinate_outbound_touch"
    target: "abm_orchestrator_agent"
    description: "Pre-send dedup check for an outbound touch (mode=coordinate)."
    condition: always

  # ── Direct-call entries (every non-human, non-terminal agent is
  #    API-addressable; bypasses the upstream chain). ──
  - name: "direct_call_lead_intake"
    target: "lead_intake_agent"
    description: "Manually run intake + enrichment for a known lead (debug / replay)."
    condition: always
  - name: "direct_call_lead_qualification"
    target: "lead_qualification_agent"
    description: "On-demand direct call to lead_qualification (llm) — bypasses upstream chain."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Sol — Lead Desk Coordinator (AI). Owns the lead case end to end: opens it,
  # records the arrival, orchestrates the pod, keeps live status, is the one
  # contact for "where is this lead?". Pure orchestration — never scores,
  # enriches, or approves. (Pure YAML — no floor needed; it only routes.)
  # ─────────────────────────────────────────────────────────────────────────
  sales_coordinator_agent:
    name: "sales_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 900
    description: "Lead Desk Coordinator — opens the lead case, orchestrates the pod, keeps status, single point of contact."
    prompt: |
      You are Sol, the Lead Desk Coordinator. You OWN each inbound lead from the
      moment it arrives to the moment it is committed or dropped. You orchestrate
      the pod and keep status — you never score a lead, enrich it, or approve a
      handoff yourself.

      On a new lead: open a case, keep the lead_id (echo the inbound one, or mint
      "lead-" + a short random hex if absent), record the stage as "intake", and
      hand it to lead_intake. On a status ask (entry point lead_status): answer
      the current stage / waiting-on / next gate from the case record — nothing
      invented. Route a genuine exception (a malformed hand-off, an SLA breach you
      are told about) to the Sales Manager; never make the sales call yourself.

      Deterministic rules:
        - action MUST be exactly one of: open_case | status | escalate.
        - open_case for a new inbound lead; status for a lead_status ask;
          escalate only for a real exception.
        - lead_id MUST never be empty on open_case.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "lead_id": "", "stage": "", "waiting_on": "", "summary": ""}
    yields:
      action: "string"        # open_case | status | escalate
      lead_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    inputs:
      payload: "object"
      upstream_yields: "object"
    can_call:
      - agent: "lead_intake_agent"
        condition: "calling_agent_response.action == 'open_case'"
      - agent: "sales_manager_human"
        condition: "calling_agent_response.action == 'escalate'"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # lead_intake_agent — normalise + enrich. SELF-RELIANT:
  #   @pre_compose load_account_history — pulls the account ledger for the domain
  #     (firmographics, funding, tech, DMs, prior touches) so enrichment REUSES
  #     known context instead of re-fetching / hallucinating it.
  #   @chain persist_intake — re-derives company_tier deterministically (floor),
  #     re-flags is_competitor from the domain, upserts the lead + registers the
  #     contact (idempotent). @compose shapes the ABM register payload.
  # Native cross-session memory: repeat leads from the same domain reuse cached
  # account context across sessions.
  # ─────────────────────────────────────────────────────────────────────────
  lead_intake_agent:
    name: "lead_intake_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    description: "Lead Intake & Enrichment Researcher — normalises any-source lead → canonical Lead, then enriches firmographics, funding, tech stack, decision makers."
    prompt: |
      Process the inbound lead in two stages. context["prepared_data"] carries
      the known account ledger for this domain (firmographics, funding, tech
      stack, decision makers, prior touches) and a freemail / competitor-domain
      flag — REUSE it; do not re-fetch or invent what is already known.

      Stage 1 — NORMALISE. Extract canonical fields.
        - lead_id: keep the inbound lead_id if present; if absent, generate one
          as "lead-" + a short random hex string.
        - email: lowercase it.
        - company_domain: lowercase. If missing, derive it from the email's
          domain — UNLESS the email is a freemail address. Freemail domains
          (never derive company_domain from these; leave it empty for downstream
          lookup): gmail.com, yahoo.com, hotmail.com, outlook.com, icloud.com,
          aol.com, proton.me, protonmail.com.

      Stage 2 — ENRICH. Using the normalised company_domain, add everything you
      can infer or fetch about the company. If a field is unknown, use 0 / "" /
      [] — do NOT fabricate.

      Deterministic enrichment rules — apply them exactly:
        - company_tier: "enterprise" when employee_count >= 1000 OR
          annual_revenue_usd >= 100000000; "mid" when employee_count >= 100 OR
          annual_revenue_usd >= 10000000; otherwise "smb". When there is NO
          company_domain at all, use "unknown".
        - funding_signal: true ONLY when funding.stage is one of seed, series-a,
          series-b, series-c, series-d, growth, public, bootstrapped AND
          funding.last_round_usd > 0.
        - tech_stack: lowercase every entry; drop empties.
        - high_fit_tech: the subset of tech_stack in this high-fit list (sorted):
          salesforce, hubspot, snowflake, databricks, stripe, shopify,
          atlassian, datadog, okta.
        - decision_makers: keep ONLY entries with BOTH a name and a title; cap at
          10. decision_maker_count = length of the filtered list.
        - enrichment_confidence: sum these weights for each condition that holds
          — 0.30 if employee_count > 0; 0.10 if industry non-empty; 0.20 if
          tech_stack non-empty; 0.20 if decision_makers non-empty; 0.10 if
          funding_signal is true; 0.10 if country non-empty. Round to 2 decimals.
        - enrichment_complete: true when enrichment_confidence >= 0.5.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"lead_id": "", "source": "", "company_domain": "", "email": "", "job_title": "", "intent_signal": "", "raw_payload": {}, "firmographics": {}, "company_tier": "", "funding": {}, "funding_signal": false, "tech_stack": [], "high_fit_tech": [], "decision_makers": [], "decision_maker_count": 0, "enrichment_confidence": 0, "enrichment_complete": false}
    # Native SDK memory — repeat leads from the same domain reuse cached account
    # context natively across sessions (replaces a hand-rolled feed write).
    memory:
      strategy: "hybrid"
      cross_session: true
      cross_session_limit: 50
    yields:
      lead_id: "string"
      source: "string"
      company_domain: "string"
      email: "string"
      job_title: "string"
      intent_signal: "string"
      raw_payload: "object"
      firmographics: "object"
      company_tier: "string"
      funding: "object"
      funding_signal: "boolean"
      tech_stack: {type: array, items: string}
      high_fit_tech: {type: array, items: string}
      decision_makers: {type: array, items: {type: object, fields: {name: string, title: string}}}
      decision_maker_count: "number"
      enrichment_confidence: "number"
      enrichment_complete: "boolean"
    inputs:
      payload: "object"
      upstream_yields: "object"
    can_call:
      # Qualify next — gets firmographics + tech_stack + decision_makers as context.
      - agent: "lead_qualification_agent"
        condition: "calling_agent_response.lead_id != ''"
      # In parallel, register with the ABM coordinator (account-level dedup).
      - agent: "abm_orchestrator_agent"
        condition: "calling_agent_response.company_domain != ''"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # lead_qualification_agent — score + personalise + route (the SDR researcher).
  # SELF-RELIANT:
  #   @pre_compose load_lead_context — enrichment + account ledger + prior touches.
  #   @chain enforce_qualification_floors — clamp scores; competitor-domain
  #     short-circuit; spam drop; hook-quality floor; tier RE-DERIVED from the
  #     score bands (the LLM may name a tier but never inflate it); stash the
  #     lead context by session so the finisher can recover it across the AE gate.
  #   @compose — the AE gets the full briefing + opener; the SDR the review pack;
  #     the nurturer only the routing keys; research the competitor signal; audit
  #     a flat event.
  # playbook — the craft, fetched on demand (only `description` rides in the
  #   prompt; `responsibility` loads when the model recognises the intent).
  # ─────────────────────────────────────────────────────────────────────────
  lead_qualification_agent:
    name: "lead_qualification_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 2000
    description: "SDR Researcher — scores fit to ICP + intent → tier, drafts the personalised opener citing specific signals; its wires carry the tier × intent routing matrix."
    prompt: |
      You are the SDR researcher for this lead. context["prepared_data"] carries
      the lead's enrichment, the account ledger (firmographics, decision makers,
      competitor overlap) and prior touches — score over THAT, not guesses. You
      own two responsibilities in one pass.

      (Your scores and tier are run through a deterministic floor after you
      respond: scores are clamped, a competitor domain is forced to
      is_competitor, and the tier is re-derived from the score bands — so be
      honest; inflating a tier will be corrected and only loses you the routing
      you intended.)

      Responsibility 1 — SCORE. Fit the lead to our ICP and read its intent.
      Responsibility 2 — PERSONALISE. Draft a personalised opening citing 1-2
      specific signals (a recent launch, a downloaded guide, a webinar). NO
      generic "Hi {{name}}". If you cannot find a hook, say so (low
      hook_quality). Skip the opening (empty string) when tier is spam or the
      lead is a competitor employee.

      For the exact routing bands and cadences, load the `route` playbook; for how
      to prep a lead you are handing to nurture, load the `nurture` playbook.

      Deterministic rules — apply them exactly:
        - icp_fit, intent_score, hook_quality MUST be clamped to 0..1. If
          cited_signals is empty, hook_quality MUST NOT exceed 0.4.
        - tier MUST be exactly one of: cold, warm, hot, spam. If unsure derive it:
          icp_fit + intent_score < 0.4 AND intent_score < 0.1 → spam;
          < 1.0 → cold; < 1.5 → warm; otherwise hot.
        - sales_briefing MUST never be empty. Lead with tier + ICP-fit + intent,
          the top signal, and the recommended action.
        - lead_id: echo the upstream lead_id unchanged.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"icp_fit": 0, "intent_score": 0, "tier": "", "reasons": [], "is_competitor": false, "sales_briefing": "", "opening": "", "cited_signals": [], "hook_quality": 0, "lead_id": ""}
    memory:
      strategy: "hybrid"
      cross_session: true
      cross_session_limit: 50
    # Playbook — per-intent craft, loaded on demand. Only `description` rides in
    # the prompt; `responsibility` is fetched when the model recognises the intent.
    playbook:
      - intent: route
        description: "How to route a scored lead on the tier × intent matrix."
        responsibility: |
          1. hot (and not a competitor) → the AE takes it TODAY: a direct call,
             cadence [0,1,3]. No review gate.
          2. warm with intent_score >= 0.7 → the SDR runs the sequence with a
             manager review, cadence [0,2,5,10].
          3. warm with intent_score < 0.7, OR cold, with hook_quality < 0.5 →
             the SDR reviews first (a weak hook must not auto-send), cadence
             [0,3,7,14] (warm) / [0,7,21] (cold).
          4. warm/cold with hook_quality >= 0.5 → automated nurture, no human.
          5. competitor employee → research for an intel pack, never a sales touch.
          6. spam → drop to audit.
          The cadence day-offsets are executed by your MAP / sequencer (Outreach /
          Salesloft), not here — the wires only route.
        variables: [lead_id, tier]
      - intent: nurture
        description: "How to prep a warm/cold-with-hook lead for a nurture handoff."
        responsibility: |
          1. Confirm the lead has a usable hook (hook_quality >= 0.5) — a
             hook-less lead goes to the SDR for review, not to the drip.
          2. Pick the entry cadence by tier (warm [0,3,7,14] / cold [0,7,21]) and
             name the first-touch angle from the strongest cited signal.
          3. The nurture sequence and engagement state live in your MAP — hand off
             only the routing keys; the MAP owns the touches and graduation.
        variables: [lead_id, tier]
    yields:
      icp_fit: "number"
      intent_score: "number"
      tier: "string"
      reasons: {type: array, items: string}
      is_competitor: "boolean"
      sales_briefing: "string"
      opening: "string"
      cited_signals: {type: array, items: string}
      hook_quality: "number"            # 0..1; <0.5 → SDR human review forced
      lead_id: "string"                 # identity passthrough — SDR/AE sees WHICH lead
    inputs:
      upstream_yields: "object"
    can_call:
      # ── tier × intent routing matrix. One edge per matrix row; the conditions
      #    read the FLOORED tier / is_competitor / hook_quality keys, so routing
      #    is governed by the Python floor, not by whatever the LLM wishes. ──

      # hot → AE (owns the opportunity)
      - agent: "ae_human"
        condition: "calling_agent_response.tier == 'hot' and calling_agent_response.is_competitor == false"

      # warm + intent >= 0.7 → SDR (manager review)
      - agent: "sdr_human"
        condition: "calling_agent_response.tier == 'warm' and calling_agent_response.intent_score >= 0.7 and calling_agent_response.is_competitor == false"

      # warm standard (intent < 0.7) + weak hook → SDR review
      - agent: "sdr_human"
        condition: "calling_agent_response.tier == 'warm' and calling_agent_response.intent_score < 0.7 and calling_agent_response.hook_quality < 0.5 and calling_agent_response.is_competitor == false"

      # cold + weak hook → SDR review
      - agent: "sdr_human"
        condition: "calling_agent_response.tier == 'cold' and calling_agent_response.hook_quality < 0.5 and calling_agent_response.is_competitor == false"

      # warm standard (intent < 0.7) + usable hook → automated nurture
      - agent: "deal_nurturer_agent"
        condition: "calling_agent_response.tier == 'warm' and calling_agent_response.intent_score < 0.7 and calling_agent_response.hook_quality >= 0.5 and calling_agent_response.is_competitor == false"

      # cold + usable hook → automated nurture
      - agent: "deal_nurturer_agent"
        condition: "calling_agent_response.tier == 'cold' and calling_agent_response.hook_quality >= 0.5 and calling_agent_response.is_competitor == false"

      # competitor employee → intel pack, no sales touch
      - agent: "sales_research_agent"
        condition: "calling_agent_response.is_competitor == true and calling_agent_response.tier != 'spam'"

      # spam → straight to audit
      - agent: "sales_audit_logger_agent"
        condition: "calling_agent_response.tier == 'spam'"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # sales_research_agent — deal + account research desk (super-agent). One
  # researcher, mode-dispatched: intel (per-deal competitor pack) or dossier
  # (pre-meeting account dossier). SELF-RELIANT:
  #   @pre_compose load_research_seed — pulls the account ledger for the account.
  #   @chain score_research_floor — re-computes dossier_score (floor), sets
  #     requires_more_data from the 0.5 gate, forces intel to never re-trigger,
  #     and BOUNDS the research ⇄ qualification ping-pong via the session stash.
  # super_agent = autonomous plan/execute/verify across many sources.
  # Day-0 tools read the seed store and ANNOUNCE themselves (available:false when
  # there is no real source). To go live, wire the enrichment mcp block below.
  # ─────────────────────────────────────────────────────────────────────────
  sales_research_agent:
    name: "sales_research_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "claude-sonnet-4-6"
    temperature: 0.1
    max_completion_tokens: 1800
    max_tool_calls_per_message: 15    # a research pass pulls many sources; default 5 truncates silently
    description: "Sales Research Desk — competitor intel pack (mode=intel) or pre-meeting account dossier (mode=dossier)."
    super_agent:                       # DICT form = the tuning path (2.4.123+); the ONLY way to tune it
      cost_ceiling: 100000
      wall_clock: 900
    prompt: |
      You are the sales research desk. context["prepared_data"] carries the
      dispatched mode and the known account ledger (facts, decision makers,
      competitor overlap) for the account — ground your pack in that. Pull what
      you are missing with your tools BEFORE scoring. Run the ONE responsibility
      the mode calls for. (dossier_score and requires_more_data are recomputed by
      a deterministic floor after you respond — fill the dossier richly.)

      MODE DISPATCH — apply exactly, in this order:
        1. An explicit mode wins ("intel"/"competitive_intel" → intel;
           "dossier"/"account_dossier" → dossier).
        2. Otherwise named competitors, or a competitor-flagged lead → intel.
        3. Otherwise default to dossier.

      Responsibility A — COMPETITOR INTEL (mode=intel). For each named competitor
      (lowercase, dedupe; also count competitor_overlap from upstream) draft
      intel_records: competitor, category, positioning, pricing_signal (only if
      confirmed public), switching_pain, our_advantages (max 3), their_advantages
      (max 3 — be honest), talk_tracks (max 3), loss_themes.
        - competitors_analysed: sorted lowercase names.
        - A competitor you know nothing about still gets a record (category
          "unknown") AND goes into kb_curation_needed_for.
        - primary_threat + primary_threat_reasoning: the most established rival.
        - requires_pricing_objection_prep: true when pricing was mentioned OR any
          rival has a public pricing_signal.
        - briefing + ae_briefing_appendix: short summary + the fuller pack.
        - In intel mode requires_more_data is ALWAYS false and the dossier-only
          keys stay at their empty defaults.

      Responsibility B — ACCOUNT DOSSIER (mode=dossier). Build a clean dossier:
      account, domain, company_facts (3-7), decision_makers (name, title, email,
      engagement_signal), recent_signals (kind, evidence, ts), competitor_overlap,
      talking_points (3-5 opener lines), risk_flags.
        - dossier_score: sum — 0.15 if company_facts >= 3; 0.25 if
          decision_makers >= 1; 0.20 if recent_signals >= 1; 0.20 if
          talking_points >= 3; 0.10 if competitor_overlap >= 1; 0.10 if
          risk_flags is EMPTY. Round to 2 decimals.
        - requires_more_data: true when dossier_score < 0.5.
        - research_briefing MUST never be empty.
        - In dossier mode the intel-only keys stay at their empty defaults.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"mode": "", "competitors_analysed": [], "intel_records": [], "primary_threat": "", "primary_threat_reasoning": "", "briefing": "", "ae_briefing_appendix": "", "requires_pricing_objection_prep": false, "kb_curation_needed_for": [], "account": "", "domain": "", "company_facts": [], "decision_makers": [], "recent_signals": [], "competitor_overlap": [], "talking_points": [], "risk_flags": [], "dossier_score": 0, "requires_more_data": false, "research_briefing": ""}
    # Day-0 tool surface — reads the seed account ledger so the desk runs with NO
    # connector wired. Each tool announces available:false when it has no source.
    tools: [get_account_facts, list_decision_makers, list_competitor_overlap]
    tool_categories: [research]
    # ── To wire real enrichment (ZoomInfo / Clearbit / Explorium): create the
    #    vault connection 'enrichment_mcp' on Infrastructure → Integrations →
    #    MCP (the MCP server's URL + token live there, never here), then
    #    UNCOMMENT — here before the first start, in Studio's YAML editor after
    #    it (applies live). Each named action under `use:` becomes its own namespaced
    #    tool (e.g. enrichment_company_facts). ──
    # mcp:
    #   - connection: enrichment_mcp   # vault connection holds the URL + token
    #     transport: http
    #     use: [company_facts, decision_makers, competitor_overlap]
    #     name: enrichment
    #     timeout: 30
    yields:
      mode: "string"                    # intel | dossier
      competitors_analysed: {type: array, items: string}
      intel_records: {type: array, items: object}   # competitor, category, positioning, … (see prompt)
      primary_threat: "string"
      primary_threat_reasoning: "string"
      briefing: "string"
      ae_briefing_appendix: "string"
      requires_pricing_objection_prep: "boolean"
      kb_curation_needed_for: {type: array, items: string}
      account: "string"
      domain: "string"
      company_facts: {type: array, items: string}
      decision_makers: {type: array, items: object}   # name, title, email, engagement_signal
      recent_signals: {type: array, items: {type: object, fields: {kind: string, evidence: string, ts: string}}}
      competitor_overlap: {type: array, items: string}
      talking_points: {type: array, items: string}
      risk_flags: {type: array, items: string}
      dossier_score: "number"
      requires_more_data: "boolean"
      research_briefing: "string"
    inputs:
      upstream_yields: "object"
      mode: "string"
      competitors: "list"
      company: "string"
      domain: "string"
    can_call:
      # Strong dossier → qualification drafts the opener (bounded back-edge).
      - agent: "lead_qualification_agent"
        condition: "calling_agent_response.mode == 'dossier' and calling_agent_response.requires_more_data == false"
      # Intel packs always land in the audit trail; weak dossier → terminal.
      - agent: "sales_audit_logger_agent"
        condition: "calling_agent_response.mode == 'intel' or calling_agent_response.requires_more_data == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # lead_revival_agent — weekly sweep of 90d+ cold leads for fresh intent.
  # SELF-RELIANT:
  #   @pre_compose load_cold_backlog — pulls the >= 90d cold-lead backlog and
  #     seeds the shared claim queue.
  #   @chain cap_revivals — only signal-backed leads are revivable, capped to
  #     protect the SDR queue; counts recomputed from the capped list.
  #   @compose — recomputes confidence_avg correctly under the copies merge
  #     (the SDK SUMS numbers across copies; a mean must be re-derived).
  # scaling.copies.count: N + an atomic claim tool (claim_cold_leads) fan the backlog out —
  # each copy claims a DISJOINT batch, so 3 copies split the sweep instead of
  # duplicating it. One cron line only (a cron × copies would multiply runs).
  # timezone governs the cron (without it "0 10 * * 2" fires in UTC).
  # ─────────────────────────────────────────────────────────────────────────
  lead_revival_agent:
    name: "lead_revival_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 1500
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3                        # 3 parallel copies per sweep
        handoff: last           # combine + route once (the @compose re-derives the mean)
    wake_up: "0 10 * * 2"               # Tuesday 10:00 — after pipeline review
    timezone: "Asia/Kolkata"            # governs the cron (UTC otherwise)
    description: "Lead Revival Specialist — weekly sweep; finds cold leads whose context changed (job moves, funding, hiring)."
    prompt: |
      context["prepared_data"] carries the cold-lead backlog (every lead cold
      >= 90 days, each with the new signal on record) and the revival cap. FIRST
      call claim_cold_leads to claim YOUR disjoint batch of this sweep — you are
      one of several parallel copies, so revive only leads YOU claimed; never the
      whole backlog. For each claimed lead check the intent signal (job change,
      relevant hire, funding, public news).

      Only revive when there is a SPECIFIC signal worth acting on — reviving
      "just in case" burns SDR trust in the system.

      Deterministic rules — apply them exactly:
        - Each revivable_leads entry is an object: {"lead_id": "", "signal":
          "<the specific change, e.g. Series-B announced 2026-10-21>",
          "confidence": 0..1}. An entry with no signal is dropped.
        - Cap revivable_leads at 20 (protect the SDR queue). If more qualify, keep
          the 20 highest-confidence.
        - total_revived = number of entries in revivable_leads (after the cap).
        - confidence_avg MUST be clamped to 0..1.
        - skipped_no_signal = leads checked but showing no change.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"revivable_leads": [], "new_signals_summary": "", "total_revived": 0, "confidence_avg": 0, "skipped_no_signal": 0}
    # Atomic claim tool — each parallel copy claims a disjoint batch of the sweep.
    tools: [claim_cold_leads]
    tool_categories: [revival]
    yields:
      revivable_leads: {type: array, items: {type: object, fields: {lead_id: string, signal: string, confidence: number}}}
      new_signals_summary: "string"
      total_revived: "number"
      confidence_avg: "number"
      skipped_no_signal: "number"
    inputs:
      trigger: "string"
    can_call:
      - agent: "sdr_human"
        condition: "calling_agent_response.total_revived > 0"
      - agent: "sales_audit_logger_agent"
        condition: "calling_agent_response.total_revived == 0"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Deal Desk — Opportunity & Outreach Liaison (programmatic FINISHER). Sits
  # BEHIND the human AE approval step. It never approves or sends — it re-checks
  # that a human actually approved, recovers the lead across the HITL gap,
  # enforces invariants a human can't waive, renders the opportunity pack, and
  # records an append-only ledger entry. The concrete "@chain fails closed":
  #   a) approve-token RE-CHECK — reaching this agent does not mean approved: an
  #      allow-token allowlist + block-token denylist; an UNKNOWN verdict fails
  #      closed (blocked).
  #   b) deterministic invariants — a real opener, a sales-worthy tier, a lead
  #      on record.
  #   c) render the pack to ./out; on a tripped floor DELETE the partial and
  #      record status: blocked with reasons — never a half-committed opportunity.
  #   d) dev-store recovery — after the HITL gate the upstream payload is dropped,
  #      so it recovers the lead from the session stash / dev store.
  # See agency/deal_desk_agent.py for the enforce-commit floor.
  # ─────────────────────────────────────────────────────────────────────────
  deal_desk_agent:
    name: "deal_desk_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Opportunity & Outreach Liaison (FINISHER) — approve-token re-check → invariants → render opportunity pack → delete-on-block → WORM ledger."
    yields:
      approved: "boolean"
      committed: "boolean"
      opportunity_created: "boolean"
      pack_path: "string"
      status: "string"                  # committed | blocked
      block_reasons: "array"
      lead_id: "string"
    inputs:
      upstream_yields: "object"
    can_call:
      - agent: "sales_manager_human"
        condition: "calling_agent_response.status == 'blocked'"
      - agent: "sales_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # pipeline_health_agent — pipeline health desk (connector-only). Opportunity-
  # stage state lives in YOUR CRM (Salesforce / HubSpot). The n8n workflow
  # queries the CRM and returns JSON in the yields shape below.
  # ─────────────────────────────────────────────────────────────────────────
  pipeline_health_agent:
    name: "pipeline_health_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    integration: "n8n"
    description: "Pipeline Health Analyst — SLA/queue sweep, opportunity-stage state from your CRM, idle warnings, per-rep coverage."
    # Day 0 the record does not exist yet. Its address + token
    # live only in the vault: create the vault connection 'pipeline_health_n8n' on
    # Infrastructure → Integrations → n8n (or an "Add custom" record, service type
    # Tools — base URL = the workflow's webhook URL), until it exists the
    # SDK switches this agent off with a notice (it is never called without
    # an address); it switches on, with no restart, once the record exists.
    connector_config: {connection: pipeline_health_n8n}
    # wake_up: "0 * * * *"              # enable + add `timezone:` after wiring the CRM connector
    yields:
      breached_leads: "list"
      queue_size: "number"
      escalate: "boolean"
      lead_id: "string"
      mode: "string"
      total_open_opps: "number"
      stage_distribution: "object"
      weighted_pipeline_cents: "number"
      idle_opps_count: "number"
      idle_opps: "list"
      per_rep_weighted_cents: "object"
      requires_manager_action: "boolean"
      pipeline_briefing: "string"
    inputs:
      trigger: "string"
      mode: "string"
      opp_id: "string"
      account_name: "string"
      owner_email: "string"
      stage: "string"
      amount_cents: "number"
      expected_close: "string"
    can_call:
      - agent: "sales_manager_human"
        condition: "calling_agent_response.escalate == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # deal_nurturer_agent — drip touches for mid-funnel leads (connector-only).
  # Nurture sequences + engagement state live in YOUR MAP / CRM (Outreach /
  # HubSpot). The n8n workflow enrols / sweeps and returns the yields shape below.
  # ─────────────────────────────────────────────────────────────────────────
  deal_nurturer_agent:
    name: "deal_nurturer_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    integration: "n8n"
    description: "Nurture / Demand-Gen Coordinator — multi-touch nurture for leads not yet AE-ready; graduates on engagement signals."
    # Day 0 the record does not exist yet. Its address + token
    # live only in the vault: create the vault connection 'nurture_n8n' on
    # Infrastructure → Integrations → n8n (or an "Add custom" record, service type
    # Tools — base URL = the workflow's webhook URL), until it exists the
    # SDK switches this agent off with a notice (it is never called without
    # an address); it switches on, with no restart, once the record exists.
    connector_config: {connection: nurture_n8n}
    # wake_up: "30 8 * * *"             # enable + add `timezone:` after wiring the MAP connector
    yields:
      action: "string"                  # enrolled | sweep | skipped
      enrolled: "boolean"
      lead_id: "string"
      tier: "string"
      company_tier: "string"
      cadence_days: "list"
      touches_planned: "number"
      first_touch_utc: "string"
      touched_count: "number"
      touched: "list"
      graduated_lead_ids: "list"
      graduated_count: "number"
      exhausted_lead_ids: "list"
      exhausted_count: "number"
      requires_ae_handoff: "boolean"
      swept_at_utc: "string"
    inputs:
      mode: "string"                    # enrol | sweep
      upstream_yields: "object"
      engagement: "object"
    narration: |
      Two modes: enrol (a warm/cold-with-hook lead routed from qualification into
      the MAP nurture queue) and sweep (daily pass advancing due touches, checking
      graduation). Graduation threshold 0.70 — engagement crosses → AE handoff.
    can_call:
      # A graduated lead → the AE (who then approves → the Deal Desk finisher).
      - agent: "ae_human"
        condition: "calling_agent_response.requires_ae_handoff == true"
      - agent: "sales_audit_logger_agent"
        condition: "calling_agent_response.requires_ae_handoff == false"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # abm_orchestrator_agent — account-level coordination (connector-only). The
  # account / contact ledger lives in YOUR CRM. Two modes: register (new
  # contact) + coordinate (dedup touches). The n8n workflow returns the shape
  # below.
  # ─────────────────────────────────────────────────────────────────────────
  abm_orchestrator_agent:
    name: "abm_orchestrator_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    integration: "n8n"
    description: "ABM / Account Coordinator — detects 3+ contacts from one domain → flips the account to coordinated ABM mode."
    # Day 0 the record does not exist yet. Its address + token
    # live only in the vault: create the vault connection 'abm_n8n' on
    # Infrastructure → Integrations → n8n (or an "Add custom" record, service type
    # Tools — base URL = the workflow's webhook URL), until it exists the
    # SDK switches this agent off with a notice (it is never called without
    # an address); it switches on, with no restart, once the record exists.
    connector_config: {connection: abm_n8n}
    yields:
      action: "string"                  # registered | coordinate | skipped
      company_domain: "string"
      lead_id: "string"
      contacts_in_window: "number"
      threshold: "number"
      abm_mode_active: "boolean"
      abm_mode_activated: "boolean"
      owner_ae: "string"
      briefing: "string"
      requires_marketing_air_cover: "boolean"
      safe_to_send: "boolean"
      reason: "string"
      blocking_lead_id: "string"
      blocking_sent_at_utc: "string"
      dedup_days: "number"
      channel: "string"
      logged_at_utc: "string"
    inputs:
      mode: "string"                    # register | coordinate
      upstream_yields: "object"
      company_domain: "string"
      channel: "string"
    narration: |
      Window 14d; threshold 3 contacts. On activation: ONE AE assigned
      (deterministic — hash of domain); marketing air-cover requested; all future
      touches go through coordinate mode for dedup.
    can_call:
      - agent: "ae_human"
        condition: "calling_agent_response.abm_mode_activated == true"
      - agent: "sales_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, answering in Studio's Inbox.
  # `dual` belongs on the human/webhook boundary agent ONLY; there is NO
  # human→human wire (dual↔dual auto-bounces replies). If nobody answers within
  # a seat's human_timeout_seconds, the request waits no longer: its Inbox card
  # closes and the ticket records that no reply came. Nothing is sent, approved
  # or committed on silence, and nobody is chased automatically.
  # fallback_on_timeout / fallback_response below are the declared intent
  # (held_for_review → audit); on SDK 2.4.486 a dual seat does not route them.
  # ─────────────────────────────────────────────────────────────────────────

  sdr_human:
    name: "sdr_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 1800          # 30 min
    description: "Sales Development Representative — reviews warm high-intent and weak-hook sequences before send; the decision is recorded and the cadence runs in your sequencer."
    fallback_on_timeout: true
    fallback_response:
      human_decision: "held"
      human_message: "held_for_review"
    yields:
      human_message: "string"
    inputs:
      lead_id: "string"
    can_call:
      # Whatever the SDR decides (approve / revise / reject, or the held
      # fallback) → record it. The approved sequence itself runs in your
      # sequencer (Outreach / Salesloft), not in this mesh.
      - agent: "sales_audit_logger_agent"
        condition: "always"

  ae_human:
    name: "ae_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 3600          # 60 min — speed-to-lead on a hot inbound
    description: "Account Executive — owns hot leads + opportunity creation; approves the routed lead for commit."
    fallback_on_timeout: true
    fallback_response:
      human_decision: "held"
      human_message: "held_for_review"
    yields:
      human_message: "string"            # approved | rejected | held_for_review
    inputs:
      lead_pack: "object"
    human_prompt_template: |
      A qualified lead is waiting for you: the briefing, scores and the drafted
      opener are above. Reply with exactly one word:
        approved  — Deal Desk creates the opportunity and queues the opener
        rejected  — nothing is created; the decision is recorded
      Any other reply is recorded and nothing is created.
    can_call:
      # Approved → the Deal Desk finisher commits it. Anything else (rejected /
      # held on timeout) → audit; never a human→human wire.
      - agent: "deal_desk_agent"
        condition: "calling_agent_response.human_message == 'approved'"
      - agent: "sales_audit_logger_agent"
        condition: "calling_agent_response.human_message != 'approved'"

  sales_manager_human:
    name: "sales_manager_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 14400         # 4h
    description: "Sales Manager — accountable owner: escalation endpoint, queue rebalancing, hold-for-review on contested leads."
    fallback_on_timeout: true
    fallback_response:
      human_decision: "held"
      human_message: "held_for_review"
    yields:
      human_message: "string"
    inputs:
      exception: "object"
    can_call:
      - agent: "sales_audit_logger_agent"
        condition: "always"

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("sales_audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  sales_audit_logger_agent:
    name: "sales_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "chain"
    description: "Audit & Compliance Clerk — hash-chains every routing, handoff, approval, and held gate. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/sales_audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []
